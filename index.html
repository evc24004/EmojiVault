<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ's Emoji Vault v3</title>
  <style>
    :root {
      --bg-base: #090b10;
      --bg-surface: rgba(18, 22, 31, 0.78);
      --bg-card: #121620;
      --bg-card-hover: #1b2232;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #6366f1;
      --text-primary: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --gif-badge: #10b981;
      --icon-display-size: 48px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 15% 0%, rgba(99, 102, 241, 0.12), transparent 40%),
        radial-gradient(circle at 85% 10%, rgba(16, 185, 129, 0.08), transparent 35%);
      color: var(--text-primary);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 24px;
    }

    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .count-pill {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      padding: 3px 10px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      flex: 1;
      max-width: 820px;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 220px;
    }

    .search-input {
      width: 100%;
      background: rgba(10, 12, 18, 0.85);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 10px 38px 10px 14px;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-input::-webkit-search-cancel-button {
      -webkit-appearance: none;
      appearance: none;
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      display: none;
      padding: 4px;
    }

    .pill-group {
      display: flex;
      background: rgba(10, 12, 18, 0.85);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pill-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .main-container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 20px 24px 60px;
    }

    .hint-bar {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    kbd {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.74rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    #virtual-spacer {
      position: relative;
      width: 100%;
    }

    .emoji-card {
      position: absolute;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 6px 6px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s ease, background-color 0.12s ease, border-color 0.12s ease;
      overflow: hidden;
    }

    .emoji-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(99, 102, 241, 0.5);
      transform: translateY(-2px);
      z-index: 2;
    }

    .sprite-box {
      width: var(--icon-display-size);
      height: var(--icon-display-size);
      background-repeat: no-repeat;
      position: relative;
      flex-shrink: 0;
    }

    .sprite-box.hydrated {
      background-image: none !important;
    }

    .live-preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.14s ease;
    }

    .live-preview.loaded {
      opacity: 1;
    }

    .emoji-label {
      margin-top: 6px;
      font-size: 0.73rem;
      color: var(--text-muted);
      max-width: 92%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .emoji-card:hover .emoji-label {
      color: var(--text-primary);
    }

    .gif-tag {
      position: absolute;
      top: 5px;
      right: 5px;
      font-size: 0.58rem;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.18);
      color: var(--gif-badge);
      border: 1px solid rgba(16, 185, 129, 0.35);
      letter-spacing: 0.03em;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 10, 0.72);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: #141824;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .modal-preview-box {
      width: 84px;
      height: 84px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      flex-shrink: 0;
    }

    .modal-preview-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      word-break: break-all;
    }

    .modal-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .copy-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .copy-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(9, 11, 16, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 9px 12px;
      gap: 10px;
    }

    .copy-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-action {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      text-decoration: none;
    }

    .btn-action:hover {
      filter: brightness(1.12);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      border: 1px solid rgba(99, 102, 241, 0.5);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.2s ease;
      z-index: 200;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span>DJ's Emoji Vault v3</span>
        <span id="count-badge" class="count-pill">Loading...</span>
      </div>
      <div class="controls">
        <div class="search-wrap">
          <input
            id="search-input"
            class="search-input"
            type="search"
            placeholder="Search 13,365 emojis... (Press / to focus)"
            autocomplete="off"
          />
          <button id="clear-btn" class="clear-btn" title="Clear search">&times;</button>
        </div>
        <div class="pill-group" id="filter-group" title="Filter by file type">
          <button class="pill-btn active" data-filter="all">All</button>
          <button class="pill-btn" data-filter="gif">GIF</button>
          <button class="pill-btn" data-filter="static">Static</button>
        </div>
        <div class="pill-group" id="size-group" title="Emoji display size (backed by 64px sprites)">
          <button class="pill-btn" data-size="32">32px</button>
          <button class="pill-btn active" data-size="48">48px</button>
          <button class="pill-btn" data-size="64">64px</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div class="hint-bar">
      <span>Click to inspect, or <kbd>Shift</kbd> + Click to copy URL.</span>
    </div>
    <div id="virtual-spacer"></div>
  </main>

  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <div class="modal-preview-box">
          <img id="modal-img" src="" alt="" />
        </div>
        <div>
          <div id="modal-title" class="modal-title"></div>
          <div id="modal-sub" class="modal-sub"></div>
        </div>
      </div>
      <div class="copy-stack">
        <div class="copy-row">
          <span id="code-url" class="copy-code"></span>
          <button class="btn-action" data-copy-target="code-url">Copy URL</button>
        </div>
        <div class="copy-row">
          <span id="code-md" class="copy-code"></span>
          <button class="btn-action" data-copy-target="code-md">Copy Markdown</button>
        </div>
        <div class="copy-row">
          <span id="code-shortcode" class="copy-code"></span>
          <button class="btn-action" data-copy-target="code-shortcode">Copy :slug:</button>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:8px;">
          <a id="download-link" class="btn-action" style="background:#334155;" download>Download File</a>
          <button id="modal-close" class="btn-action" style="background:transparent; border:1px solid var(--border-subtle);">Close (Esc)</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const DIRECT_EMOJI_BASE_URL = "public";
    const SPRITE_BASE_URL = "sprites";
    const INDEX_URL = "gallery_index.json";

    const GRID_GAP = 10;
    const OVERSCAN_ROWS = 3;
    const SCROLL_IDLE_GIF_DELAY_MS = 120;
    const HOVER_HYDRATE_DELAY_MS = 140;

    const hydratedGifCache = new Set();

    const state = {
      meta: { total: 0, gridDim: 16, cellSize: 64, exts: ["png", "gif", "webp", "jpg", "jpeg"] },
      allItems: [],
      filteredItems: [],
      activeFilter: "all",
      displaySize: 48,
      cardMinWidth: 104,
      cardHeight: 96,
      query: "",
      cols: 1,
      colWidth: 104,
      hoverTimer: null,
      scrollIdleTimer: null,
    };

    const spacerEl = document.getElementById("virtual-spacer");
    const searchInput = document.getElementById("search-input");
    const clearBtn = document.getElementById("clear-btn");
    const countBadge = document.getElementById("count-badge");
    const toastEl = document.getElementById("toast");
    const modalBackdrop = document.getElementById("modal-backdrop");

    /**
     * Updates card geometry variables whenever the user switches between 32px, 48px, and 64px icons.
     * @param {number} iconPx Target icon display size in CSS pixels.
     */
    function setDisplaySizeGeometry(iconPx) {
      state.displaySize = iconPx;
      document.documentElement.style.setProperty("--icon-display-size", `${iconPx}px`);
      state.cardMinWidth = Math.max(88, iconPx + 52);
      state.cardHeight = iconPx + 46;
    }

    /**
     * Builds the direct URL for an individual full-resolution emoji file.
     * @param {Object} item Normalized emoji entry.
     * @return {string} Direct URL path or full URL.
     */
    function getDirectEmojiUrl(item) {
      const prefix = DIRECT_EMOJI_BASE_URL ? DIRECT_EMOJI_BASE_URL.replace(/\/$/, "") : "";
      const filename = `${item.slug}.${item.ext}`;
      return prefix ? `${prefix}/${filename}` : `/${filename}`;
    }

    /**
     * Displays a brief notification toast at the bottom-right of the viewport.
     * @param {string} message Text to display.
     */
    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    /**
     * Copies text to the clipboard and triggers a confirmation toast.
     * @param {string} text Content to copy.
     * @param {string} label Short description for the toast.
     */
    async function copyToClipboard(text, label = "Copied to clipboard") {
      try {
        await navigator.clipboard.writeText(text);
        showToast(`${label}: ${text}`);
      } catch {
        showToast("Clipboard copy failed");
      }
    }

    /**
     * Injects the live direct image (animated GIF or full-res static image) into a card's spriteBox.
     * Once loaded, hides the underlying static sprite cell so transparent GIF frames do not ghost.
     * @param {HTMLElement} card Target .emoji-card DOM node.
     * @param {Object} item Normalized emoji entry.
     */
    function mountDirectImageIntoCard(card, item) {
      const spriteBox = card.querySelector(".sprite-box");
      if (!spriteBox || spriteBox.querySelector(".live-preview")) return;

      const directUrl = getDirectEmojiUrl(item);
      const img = document.createElement("img");
      img.className = "live-preview";
      img.decoding = "async";
      img.loading = "lazy";
      img.src = directUrl;
      img.alt = item.slug;

      img.onload = () => {
        if (item.ext === "gif") {
          hydratedGifCache.add(directUrl);
        }
        spriteBox.classList.add("hydrated");
        img.classList.add("loaded");
      };

      spriteBox.appendChild(img);
    }

    /**
     * Sweeps all currently mounted GIF cards inside the live viewport after scrolling
     * settles and upgrades them from their static Frame-0 sprite preview to the animated GIF.
     */
    function hydrateVisibleViewportGifs() {
      const viewHeight = window.innerHeight;
      const gifCards = spacerEl.querySelectorAll('.emoji-card[data-is-gif="1"]');

      for (let i = 0; i < gifCards.length; i++) {
        const card = gifCards[i];
        const rect = card.getBoundingClientRect();
        if (rect.bottom >= -40 && rect.top <= viewHeight + 40) {
          const item = state.filteredItems[Number(card.dataset.itemIdx)];
          if (item) {
            mountDirectImageIntoCard(card, item);
          }
        }
      }
    }

    /**
     * Debounces viewport GIF hydration so fast scrollbar dragging uses zero direct requests
     * until the user slows down or stops scrolling for SCROLL_IDLE_GIF_DELAY_MS.
     */
    function scheduleScrollIdleGifHydration() {
      clearTimeout(state.scrollIdleTimer);
      state.scrollIdleTimer = setTimeout(hydrateVisibleViewportGifs, SCROLL_IDLE_GIF_DELAY_MS);
    }

    /**
     * Applies current search query and extension filter to state.allItems,
     * ranking prefix matches ahead of substring matches.
     */
    function applyFilters() {
      const q = state.query.trim().toLowerCase();
      const tokens = q ? q.split(/\s+/) : [];
      const mode = state.activeFilter;

      const prefixMatches = [];
      const substringMatches = [];

      for (let i = 0; i < state.allItems.length; i++) {
        const item = state.allItems[i];
        if (mode === "gif" && item.ext !== "gif") continue;
        if (mode === "static" && item.ext === "gif") continue;

        if (tokens.length === 0) {
          prefixMatches.push(item);
          continue;
        }

        let matchedAll = true;
        for (let t = 0; t < tokens.length; t++) {
          if (!item.searchKey.includes(tokens[t])) {
            matchedAll = false;
            break;
          }
        }
        if (!matchedAll) continue;

        if (item.slugLower.startsWith(tokens[0]) || item.nameLower.startsWith(tokens[0])) {
          prefixMatches.push(item);
        } else {
          substringMatches.push(item);
        }
      }

      state.filteredItems = prefixMatches.concat(substringMatches);
      countBadge.textContent = `${state.filteredItems.length.toLocaleString()} / ${state.allItems.length.toLocaleString()}`;
      updateVirtualGrid(true);
    }

    /**
     * Computes grid geometry and mounts only the DOM cards visible inside the
     * current scroll viewport plus OVERSCAN_ROWS. Scales the 64px sprite sheet
     * cells proportionally to state.displaySize (32px, 48px, or 64px).
     * @param {boolean} forceRecalc Whether to recompute column layout and total height.
     */
    function updateVirtualGrid(forceRecalc = false) {
      const containerWidth = spacerEl.clientWidth || window.innerWidth - 48;
      const cols = Math.max(2, Math.floor((containerWidth + GRID_GAP) / (state.cardMinWidth + GRID_GAP)));
      const colWidth = (containerWidth - (cols - 1) * GRID_GAP) / cols;
      const totalRows = Math.ceil(state.filteredItems.length / cols);
      const rowStride = state.cardHeight + GRID_GAP;
      const totalHeight = Math.max(0, totalRows * rowStride - GRID_GAP);

      if (forceRecalc || cols !== state.cols || colWidth !== state.colWidth) {
        state.cols = cols;
        state.colWidth = colWidth;
      }
      spacerEl.style.height = `${totalHeight}px`;

      const rect = spacerEl.getBoundingClientRect();
      const scrollTopInGrid = Math.max(0, -rect.top);
      const viewportHeight = window.innerHeight;

      const startRow = Math.max(0, Math.floor(scrollTopInGrid / rowStride) - OVERSCAN_ROWS);
      const endRow = Math.min(
        totalRows - 1,
        Math.ceil((scrollTopInGrid + viewportHeight) / rowStride) + OVERSCAN_ROWS
      );

      const startIdx = startRow * cols;
      const endIdx = Math.min(state.filteredItems.length, (endRow + 1) * cols);

      const fragment = document.createDocumentFragment();
      const displayPx = state.displaySize;
      const scaledSheetDim = state.meta.gridDim * displayPx;

      for (let idx = startIdx; idx < endIdx; idx++) {
        const item = state.filteredItems[idx];
        const r = Math.floor(idx / cols);
        const c = idx % cols;

        const card = document.createElement("div");
        card.className = "emoji-card";
        card.style.width = `${colWidth}px`;
        card.style.height = `${state.cardHeight}px`;
        card.style.transform = `translate3d(${c * (colWidth + GRID_GAP)}px, ${r * rowStride}px, 0)`;
        card.dataset.itemIdx = idx;

        const sheetIdx = item.id >> 8;
        const cellIdx = item.id & 255;
        const spriteCol = cellIdx & 15;
        const spriteRow = cellIdx >> 4;
        const sheetName = `${SPRITE_BASE_URL}/sheet_${String(sheetIdx).padStart(3, "0")}.webp`;

        const spriteBox = document.createElement("div");
        spriteBox.className = "sprite-box";
        spriteBox.style.backgroundImage = `url('${sheetName}')`;
        spriteBox.style.backgroundSize = `${scaledSheetDim}px ${scaledSheetDim}px`;
        spriteBox.style.backgroundPosition = `-${spriteCol * displayPx}px -${spriteRow * displayPx}px`;

        if (item.ext === "gif") {
          card.dataset.isGif = "1";
          const badge = document.createElement("span");
          badge.className = "gif-tag";
          badge.textContent = "GIF";
          card.appendChild(badge);
        }

        const label = document.createElement("div");
        label.className = "emoji-label";
        label.textContent = item.slug;

        card.appendChild(spriteBox);
        card.appendChild(label);

        if (item.ext === "gif" && hydratedGifCache.has(getDirectEmojiUrl(item))) {
          mountDirectImageIntoCard(card, item);
        }

        fragment.appendChild(card);
      }

      spacerEl.replaceChildren(fragment);
      scheduleScrollIdleGifHydration();
    }

    /**
     * Opens the inspector modal for a selected emoji item and loads its direct asset.
     * @param {Object} item Normalized emoji entry.
     */
    function openInspector(item) {
      const directPath = getDirectEmojiUrl(item);
      const absoluteUrl = new URL(directPath, window.location.origin).href;

      document.getElementById("modal-img").src = directPath;
      document.getElementById("modal-img").alt = item.slug;
      document.getElementById("modal-title").textContent = `:${item.slug}:`;
      document.getElementById("modal-sub").textContent = `${item.slug}.${item.ext} (base: ${item.name})`;
      document.getElementById("code-url").textContent = absoluteUrl;
      document.getElementById("code-md").textContent = `![${item.slug}](${absoluteUrl})`;
      document.getElementById("code-shortcode").textContent = `:${item.slug}:`;

      const dl = document.getElementById("download-link");
      dl.href = directPath;
      dl.download = `${item.slug}.${item.ext}`;

      modalBackdrop.classList.add("open");
    }

    /**
     * Hydrates a hovered static card with its direct image file after a short intent delay.
     * @param {HTMLElement} card The hovered .emoji-card element.
     */
    function scheduleCardHoverHydration(card) {
      clearTimeout(state.hoverTimer);
      state.hoverTimer = setTimeout(() => {
        const idx = Number(card.dataset.itemIdx);
        const item = state.filteredItems[idx];
        if (item) {
          mountDirectImageIntoCard(card, item);
        }
      }, HOVER_HYDRATE_DELAY_MS);
    }

        /**
     * Fisher-Yates shuffle. Mutates the array in place. Each item keeps its
     * original `id`, so sprite sheet lookups are unaffected.
     * @param {Array} arr Array to shuffle.
     */
    function shuffleInPlace(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    /**
     * Fetches gallery_index.json, unpacks items in memory, and wires event listeners.
     */
    async function initGallery() {
      setDisplaySizeGeometry(state.displaySize);
      try {
        const res = await fetch(INDEX_URL);
        const data = await res.json();
        state.meta = data.meta;

        state.allItems = data.items.map((tuple, id) => {
          const slug = tuple[0];
          const ext = state.meta.exts[tuple[1]] || "png";
          const name = tuple[2] || slug;
          const slugLower = slug.toLowerCase();
          const nameLower = name.toLowerCase();
          return {
            id,
            slug,
            name,
            ext,
            slugLower,
            nameLower,
            searchKey: slugLower === nameLower ? slugLower : `${slugLower} ${nameLower}`,
          };
        });

        shuffleInPlace(state.allItems);

        applyFilters();

        applyFilters();
      } catch (err) {
        countBadge.textContent = "Index failed to load";
        console.error("Failed to load gallery_index.json:", err);
      }
    }

    let scrollTick = false;
    window.addEventListener("scroll", () => {
      if (!scrollTick) {
        window.requestAnimationFrame(() => {
          updateVirtualGrid(false);
          scrollTick = false;
        });
        scrollTick = true;
      }
    }, { passive: true });

    new ResizeObserver(() => updateVirtualGrid(true)).observe(spacerEl);

    searchInput.addEventListener("input", (e) => {
      state.query = e.target.value;
      clearBtn.style.display = state.query ? "block" : "none";
      window.scrollTo({ top: 0, behavior: "instant" });
      applyFilters();
    });

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      state.query = "";
      clearBtn.style.display = "none";
      searchInput.focus();
      applyFilters();
    });

    document.getElementById("filter-group").addEventListener("click", (e) => {
      const btn = e.target.closest(".pill-btn");
      if (!btn) return;
      document.querySelectorAll("#filter-group .pill-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      state.activeFilter = btn.dataset.filter;
      window.scrollTo({ top: 0, behavior: "instant" });
      applyFilters();
    });

    document.getElementById("size-group").addEventListener("click", (e) => {
      const btn = e.target.closest(".pill-btn");
      if (!btn) return;
      document.querySelectorAll("#size-group .pill-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      setDisplaySizeGeometry(Number(btn.dataset.size));
      updateVirtualGrid(true);
    });

    spacerEl.addEventListener("mouseover", (e) => {
      const card = e.target.closest(".emoji-card");
      if (card) scheduleCardHoverHydration(card);
    });

    spacerEl.addEventListener("mouseout", (e) => {
      if (e.target.closest(".emoji-card")) clearTimeout(state.hoverTimer);
    });

    spacerEl.addEventListener("click", (e) => {
      const card = e.target.closest(".emoji-card");
      if (!card) return;
      const item = state.filteredItems[Number(card.dataset.itemIdx)];
      if (!item) return;

      if (e.shiftKey) {
        const url = new URL(getDirectEmojiUrl(item), window.location.origin).href;
        copyToClipboard(url, "Copied URL");
      } else {
        openInspector(item);
      }
    });

    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop || e.target.id === "modal-close") {
        modalBackdrop.classList.remove("open");
      }
      const copyBtn = e.target.closest("[data-copy-target]");
      if (copyBtn) {
        const targetEl = document.getElementById(copyBtn.dataset.copyTarget);
        if (targetEl) copyToClipboard(targetEl.textContent);
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      } else if (e.key === "Escape") {
        modalBackdrop.classList.remove("open");
      }
    });

    initGallery();
  </script>
</body>
</html>
